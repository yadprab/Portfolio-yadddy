name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · analyze · size
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm (from package.json packageManager)
        uses: pnpm/action-setup@v4

      - name: setup node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: rebuild native deps (esbuild, sharp)
        run: pnpm rebuild esbuild sharp

      - name: analyze (typecheck + astro diagnostics)
        run: pnpm analyze

      - name: bundle (production build)
        run: pnpm bundle

      - name: report bundle size
        run: |
          echo "## bundle output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist 2>/dev/null >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'biggest files:' >> "$GITHUB_STEP_SUMMARY"
          find dist -type f -exec du -h {} + 2>/dev/null | sort -rh | head -15 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error
